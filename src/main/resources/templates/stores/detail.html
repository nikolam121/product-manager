<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </head>

    <body>
        <div th:replace="fragments/navbar :: navbar"></div>
        <tr>
            <td th:text="${store.storeName}"></td>
            <td th:text="${store.address.city}"></td>
            <td th:text="${store.address.country}"></td>
            <td th:text="${store.address.streetName}"></td>
            <td th:text="${store.address.houseNumber}"></td>
            <td th:text="${store.telephoneNumber}"></td>
            <td th:text="${store.email}"></td>
            <tr th:each="day : ${store.workingDays}">
                <td th:text="${day.dayOfWeek}"></td>
                <td th:text="${day.startTime}"></td>
                <td th:text="${day.endTime}"></td>
            </tr>
        </tr>
    </body>
</html>>
