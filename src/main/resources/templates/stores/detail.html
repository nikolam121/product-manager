<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" th:href="@{/css/style.css}">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </head>

    <body>
        <div th:replace="fragments/navbar :: navbar"></div>
        <div class="container">
            <h1 th:text="${store.storeName}"></h1>
            <table class="table">
                <tbody>
                    <tr>
                        <th>City</th>
                        <td th:text="${store.address.city}"></td>
                    </tr>
                    <tr>
                        <th>Country</th>
                        <td th:text="${store.address.country}"></td>
                    </tr>
                    <tr>
                        <th>Street</th>
                        <td th:text="${store.address.streetName}"></td>
                    </tr>
                    <tr>
                        <th>House number</th>
                        <td th:text="${store.address.houseNumber}"></td>
                    </tr>
                    <tr>
                        <th>Phone</th>
                        <td th:text="${store.telephoneNumber}"></td>
                    </tr>
                    <tr>
                        <th>Email</th>
                        <td th:text="${store.email}"></td>
                    </tr>
                </tbody>
            </table>

            <h2>Working Hours</h2>
            <table class="table" th:if="${not #lists.isEmpty(store.workingDays)}">
                <thead>
                    <tr>
                        <th>Day</th>
                        <th>From</th>
                        <th>To</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="day : ${store.workingDays}">
                        <td th:text="${day.dayOfWeek}"></td>
                        <td th:text="${day.startTime}"></td>
                        <td th:text="${day.endTime}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </body>
</html>
