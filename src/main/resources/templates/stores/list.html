<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <head>
            <meta charset="UTF-8">
            <link rel="stylesheet" href="css/style.css">
            <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        </head>
    </head>
    <body>
    <div th:replace="fragments/navbar :: navbar"></div>
        <p th:if="${#lists.isEmpty(stores)}">Store list is empty</p>
        <div th:if="${not #lists.isEmpty(stores)}">
            <tr th:each="store : ${stores}">
                <br>
                <td th:text="${store.storeName}"></td>
                <td th:text="${store.address.city}"></td>
                <br>
                <td>
                    <a class="btn btn-sm btn-primary"
                       th:href="@{/stores-view/{id}(id=${store.id})}">Detalji</a>
                </td>
                <br>
                <td>
                    <a class="btn btn-sm btn-primary"
                       th:method="post" th:href="@{/stores-view/{storeId}/edit(storeId=${store.id})}">Uredi</a>
                </td>
                <br>
                <td>
                    <form th:action="@{/stores-view/{id}/delete(id=${store.id})}" method="post">
                        <button type="submit" class="btn btn-sm btn-danger">Obriši</button>
                    </form>
                </td>
            </tr>
        </div>
    </body>
</html>>
