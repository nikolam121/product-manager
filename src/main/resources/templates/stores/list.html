<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" th:href="@{/css/style.css}">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </head>
    <body>
    <div th:replace="fragments/navbar :: navbar"></div>
    <div class="container">
        <h1>Stores</h1>
        <a class="btn btn-success mb-3" th:href="@{/stores-view/new}">New store</a>
        <p th:if="${#lists.isEmpty(stores)}">Store list is empty</p>
        <table class="table" th:if="${not #lists.isEmpty(stores)}">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>City</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="store : ${stores}">
                    <td th:text="${store.storeName}"></td>
                    <td th:text="${store.address.city}"></td>
                    <td>
                        <a class="btn btn-sm btn-primary"
                           th:href="@{/stores-view/{id}(id=${store.id})}">Details</a>
                        <a class="btn btn-sm btn-primary"
                           th:href="@{/stores-view/{storeId}/edit(storeId=${store.id})}">Edit</a>
                        <form th:action="@{/stores-view/{id}/delete(id=${store.id})}" method="post" style="display:inline">
                            <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    </body>
</html>
