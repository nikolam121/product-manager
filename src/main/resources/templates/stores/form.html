<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </head>

    <body>
        <div th:replace="fragments/navbar :: navbar"></div>
        <form th:action="@{/stores-view/{action}(action=${action})}" th:object="${storeForm}" method="post">
            <label class="form-label" for="storeName">Naziv dućana</label>
            <input class="form-control" id="storeName" th:field="*{storeName}">
            <div class="text-danger" th:if="${#fields.hasErrors('storeName')}"
                 th:errors="*{storeName}"></div>
            <br>
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" th:field="*{email}">
            <div class="text-danger" th:if="${#fields.hasErrors('email')}"
                 th:errors="*{email}"></div>
            <br>
            <label class="form-label" for="telephoneNumber">Broj telefona</label>
            <input class="form-control" id="telephoneNumber" th:field="*{telephoneNumber}">
            <div class="text-danger" th:if="${#fields.hasErrors('telephoneNumber')}"
                 th:errors="*{telephoneNumber}"></div>
            <br>
            <label class="form-label" for="city">Grad</label>
            <input class="form-control" id="city" th:field="*{city}">
            <div class="text-danger" th:if="${#fields.hasErrors('city')}"
                 th:errors="*{city}"></div>
            <br>
            <label class="form-label" for="country">Država</label>
            <input class="form-control" id="country" th:field="*{country}">
            <div class="text-danger" th:if="${#fields.hasErrors('country')}"
                 th:errors="*{country}"></div>
            <br>
            <label class="form-label" for="streetName">Ulica</label>
            <input class="form-control" id="streetName" th:field="*{streetName}">
            <div class="text-danger" th:if="${#fields.hasErrors('streetName')}"
                 th:errors="*{streetName}"></div>
            <br>
            <label class="form-label" for="houseNumber">Kućni broj</label>
            <input class="form-control" id="houseNumber" th:field="*{houseNumber}">
            <div class="text-danger" th:if="${#fields.hasErrors('houseNumber')}"
                 th:errors="*{houseNumber}"></div>

            <button type="submit" class="btn btn-success">Spremi</button>
        </form>
    </body>
</html>
