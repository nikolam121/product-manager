<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <h1>Products</h1>

    <div class="row mb-3">
        <div class="col-auto">
            <input type="date" id="date-input" class="form-control">
        </div>
        <div class="col-auto">
            <button id="fetch-btn" class="btn btn-primary">Fetch products</button>
        </div>
        <div class="col-auto">
            <button id="sum-btn" class="btn btn-secondary">Sum of prices</button>
        </div>
    </div>

    <div id="poruka" class="text-danger mb-3"></div>

    <div class="mb-3">
        <div id="spinner" class="spinner-border d-none" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <span id="sum-result"></span>
    </div>

    <table class="table">
        <thead>
        <tr>
            <th>Name</th>
            <th>Price</th>
            <th>Unit</th>
            <th>Grade</th>
        </tr>
        </thead>
        <tbody id="products-body"></tbody>
    </table>
</div>

<script th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/products.js}"></script>
</body>
</html>
